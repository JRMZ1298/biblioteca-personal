services:
  backend:
    build: ./backend
    container_name: biblioteca-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://biblioteca:biblioteca@db:5432/biblioteca
      - SECRET_KEY=change-me-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-your-google-books-api-key}
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:80,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - biblioteca-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: biblioteca-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: biblioteca-db
    environment:
      - POSTGRES_USER=biblioteca
      - POSTGRES_PASSWORD=biblioteca
      - POSTGRES_DB=biblioteca
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  biblioteca-data:
